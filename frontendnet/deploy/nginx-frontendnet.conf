# /etc/nginx/sites-available/frontendnet  (symlink into sites-enabled; remove the "default" site)
# Port 80 is intentionally NOT served (rubric: port 80 closed). Only 443.
# Works on nginx 1.22 (Debian 12) and 1.24 (Ubuntu 24.04).
#
# Header ownership (no duplicates):
#   - nginx:  Strict-Transport-Security, X-Content-Type-Options (with "always", so 4xx/5xx pages
#             generated by nginx itself also carry them); the app's copies are hidden below.
#   - app:    Content-Security-Policy, X-Frame-Options, Referrer-Policy, Permissions-Policy
#             (SecurityHeadersMiddleware) - nginx must NOT add them.

# Throttle only POSTs (login / self-registration submits): GETs of the forms get an empty key = not limited.
map $request_method $dima_login_key {
    POST    $binary_remote_addr;
    default "";
}
# Coarse per-IP flood guard only; per-email brute-force limiting is the backend limiter (DEC-016, key ${ip}:${email}).
# 30r/m + burst 20 lets 11+ failed logins for one email through so they cannot lock out other users behind the same IP.
limit_req_zone $dima_login_key zone=dima_login:10m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name web.dima.lab;

    ssl_certificate     /etc/ssl/dima/web.dima.lab.crt;
    ssl_certificate_key /etc/ssl/dima/web.dima.lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;   # uploads are <= 100 KB; leave headroom for multipart overhead

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/frontendnet.access.log;
    error_log  /var/log/nginx/frontendnet.error.log warn;

    # Brute-force throttle on the login and registration endpoints (defense in depth; the backend
    # also limits by ${ip}:${email}, DEC-016). Case-insensitive because ASP.NET routing is.
    location ~* ^/(Auth|Registro)(/Index)?/?$ {
        limit_req zone=dima_login burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dima-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/dima-proxy.conf;
    }
}
