# /etc/nginx/sites-available/frontendnet  (symlink into sites-enabled; remove the "default" site)
# Port 80 is intentionally NOT served (rubric: port 80 closed). Only 443.

limit_req_zone $binary_remote_addr zone=dima_login:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name web.dima.lab;

    ssl_certificate     /etc/ssl/dima/web.dima.lab.crt;
    ssl_certificate_key /etc/ssl/dima/web.dima.lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 1m;   # uploads are <= 100 KB; leave headroom for multipart overhead

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/frontendnet.access.log;
    error_log  /var/log/nginx/frontendnet.error.log warn;

    # Brute-force throttle on the login and registration endpoints (defense in depth)
    location ~ ^/(Auth|Registro)$ {
        limit_req zone=dima_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dima-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/dima-proxy.conf;
    }
}
