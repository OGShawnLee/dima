# /etc/nginx/snippets/dima-proxy.conf  (Kestrel listens on 127.0.0.1:5000 only)
proxy_pass         http://127.0.0.1:5000;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
# Overwrite (do not append) so clients cannot spoof their IP through X-Forwarded-For.
# The app trusts X-Forwarded-* only from loopback (UseForwardedHeaders default KnownProxies).
proxy_set_header   X-Forwarded-For   $remote_addr;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  "";
proxy_set_header   Connection        "";
proxy_read_timeout 60s;
