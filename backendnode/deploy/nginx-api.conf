# /etc/nginx/sites-available/backendnode (symlink into sites-enabled; remove "default")
# Port 80 is intentionally NOT served (rubric: port 80 closed). Only 443.

server {
    listen 443 ssl http2;
    server_name api.dima.lab;

    ssl_certificate     /etc/ssl/dima/api.dima.lab.crt;
    ssl_certificate_key /etc/ssl/dima/api.dima.lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/backendnode.access.log;
    error_log  /var/log/nginx/backendnode.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append so the browser IP forwarded by web.dima.lab is preserved for TRUST_PROXY
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
